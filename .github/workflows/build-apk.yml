name: Build APK from uploaded source ZIP
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RearYTM2.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract source ZIP
        run: |
          mkdir -p /tmp/rearytm-source
          unzip -q RearYTM2.zip -d /tmp/rearytm-source
          test -f /tmp/rearytm-source/RearYTM/app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> /tmp/rearytm-source/RearYTM/gradle.properties
      - name: Build debug APK
        run: gradle --no-daemon -p /tmp/rearytm-source/RearYTM :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RearYTM-debug-apk
          path: /tmp/rearytm-source/RearYTM/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
