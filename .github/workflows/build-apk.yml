name: Build APK from uploaded source ZIP
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'YTRear-shizuku-1.4.0.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract updated source ZIP
        run: |
          mkdir -p /tmp/rearytm-source
          unzip -q YTRear-shizuku-1.4.0.zip -d /tmp/rearytm-source
          BUILD_FILE="$(find /tmp/rearytm-source -path '*/app/build.gradle.kts' -print -quit)"
          test -n "$BUILD_FILE"
          PROJECT_DIR="$(dirname "$(dirname "$BUILD_FILE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YTRear-shizuku-1.4.0-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
